# ===========================================================================
# order-service — Deployment (secao 12) + Service
#
# PRODUCT_SERVICE_URL aponta para "http://product-service:8081" — o NOME DO
# SERVICE do Kubernetes criado em 1-product-service.yaml, nunca um IP fixo
# (secao 12 exige exatamente isso).
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: tp2-loja
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: tp2/order-service:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:8081"
          ports:
            - containerPort: 8082
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: tp2-loja
spec:
  type: NodePort
  selector:
    app: order-service
  ports:
    - port: 8082
      targetPort: 8082
      nodePort: 30082
