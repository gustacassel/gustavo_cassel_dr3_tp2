spring.application.name=order-service
server.port=${SERVER_PORT:8082}

# Local (fora de container): aponta para o product-service rodando na
# mesma maquina. Em Docker/Kubernetes, PRODUCT_SERVICE_URL sobrescreve
# este valor para o nome do container/Service (nunca localhost).
product.service.url=${PRODUCT_SERVICE_URL:http://localhost:8081}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
